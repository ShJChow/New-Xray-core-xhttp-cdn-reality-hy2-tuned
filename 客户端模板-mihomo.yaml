mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.msftconnecttest.com
    - +.msftncsi.com
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - +.in-addr.arpa
    - +.ip6.arpa
    - time.*.com
    - time.*.gov
    - pool.ntp.org
    - localhost.work.weixin.qq.com
  default-nameserver:
    - 223.5.5.5
    - 1.2.4.8
  nameserver:
    - https://208.67.222.222/dns-query
    - https://77.88.8.8/dns-query
    - https://1.1.1.1/dns-query
    - https://8.8.4.4/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:private,cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

proxies:
  - name: Vless-reality-vision-YOUR_HOST
    type: vless
    server: YOUR_VPS_IP
    port: 443
    uuid: YOUR_UUID_1
    udp: true
    tls: true
    flow: xtls-rprx-vision
    encryption: "none"
    network: tcp
    alpn:
      - h2
    servername: YOUR_REALITY_DOMAIN
    client-fingerprint: chrome
    reality-opts:
      public-key: YOUR_PUBLIC_KEY
      short-id: YOUR_SHORT_ID

  - name: Vless-xhttp-reality-YOUR_HOST
    type: vless
    server: YOUR_VPS_IP
    port: 443
    uuid: YOUR_UUID_2
    udp: true
    flow: ""
    tls: true
    encryption: YOUR_VLESSENC_ENCRYPTION
    network: xhttp
    alpn:
      - h2
    servername: YOUR_REALITY_DOMAIN
    client-fingerprint: chrome
    reality-opts:
      public-key: YOUR_PUBLIC_KEY
      short-id: YOUR_SHORT_ID
    xhttp-opts:
      path: YOUR_PATH
      mode: auto
      reuse-settings:
        max-concurrency: "16-32"
        c-max-reuse-times: "0"
        h-max-reusable-secs: "1800-3000"

  # 经 CDN 的 h3 节点。servername/host 必须是 CDN 域名——TLS 握手按 SNI 选服务端
  # server 块，写成 Reality 域名会落到回落网站上，节点必然不通。
  - name: Vless-xhttp-tls-UDP-cdn-YOUR_HOST
    type: vless
    server: YOUR_CDN_DOMAIN
    port: 443
    uuid: YOUR_UUID_2
    udp: true
    flow: ""
    tls: true
    network: xhttp
    # alpn 必须恰好只有 h3，mihomo 才会走 HTTP/3
    alpn:
      - h2
      - http/1.1
    servername: YOUR_CDN_DOMAIN
    client-fingerprint: chrome
    encryption: YOUR_VLESSENC_ENCRYPTION
    xhttp-opts:
      host: YOUR_CDN_DOMAIN
      path: YOUR_PATH
      mode: auto
      reuse-settings:
        max-concurrency: "16-32"
        c-max-reuse-times: "0"
        h-max-reusable-secs: "1800-3000"

  # 直连 VPS 的 h3 节点（v4.0.0 起默认生成）。Xray 自己监听 UDP 443，不经 nginx。
  # sni 用 Reality 域名——证书是 Reality+CDN 双域名 SAN，直连侧取前者。
  - name: Vless-xhttp-h3-direct-YOUR_HOST
    type: vless
    server: YOUR_VPS_IP
    port: 443
    uuid: YOUR_UUID_2
    udp: true
    flow: ""
    tls: true
    network: xhttp
    alpn:
      - h3
    servername: YOUR_REALITY_DOMAIN
    client-fingerprint: chrome
    encryption: YOUR_VLESSENC_ENCRYPTION
    xhttp-opts:
      path: YOUR_PATH
      mode: auto
      reuse-settings:
        max-concurrency: "16-32"
        c-max-reuse-times: "0"
        h-max-reusable-secs: "1800-3000"

  # Hysteria2 + Salamander 混淆（UDP 8443），由 Xray 原生 hysteria inbound 提供。
  # password 与 obfs-password 是两个独立的值，两端都必须一致。
  # up/down 不写 = 客户端用 BBR；写具体速率则切到 Brutal 模式。
  - name: Hysteria2-obfs-YOUR_HOST
    type: hysteria2
    server: YOUR_VPS_IP
    port: 8443
    password: YOUR_HY2_PASSWORD
    obfs: salamander
    obfs-password: YOUR_OBFS_PASSWORD
    sni: YOUR_REALITY_DOMAIN
    skip-cert-verify: false
    alpn:
      - h3

  # 上下行分离节点：上行 Reality 直连极速响应，下行拉取 CDN 缓存大带宽
  - name: Vless-xhttp-reality-up-cdn-down-YOUR_HOST
    type: vless
    server: YOUR_VPS_IP
    port: 443
    uuid: YOUR_UUID_2
    udp: true
    flow: ""
    tls: true
    encryption: YOUR_VLESSENC_ENCRYPTION
    network: xhttp
    alpn:
      - h2
    servername: YOUR_REALITY_DOMAIN
    client-fingerprint: chrome
    reality-opts:
      public-key: YOUR_PUBLIC_KEY
      short-id: YOUR_SHORT_ID
    xhttp-opts:
      path: YOUR_PATH
      mode: auto
      reuse-settings:
        max-concurrency: "16-32"
        c-max-reuse-times: "0"
        h-max-reusable-secs: "1800-3000"
      download-settings:
        server: YOUR_CDN_DOMAIN
        port: 443
        network: xhttp
        tls: true
        alpn:
          - h2
          - http/1.1
        servername: YOUR_CDN_DOMAIN
        client-fingerprint: chrome
        xhttp-opts:
          host: YOUR_CDN_DOMAIN
          path: YOUR_PATH
          mode: auto
          reuse-settings:
            max-concurrency: "16-32"
            c-max-reuse-times: "0"
            h-max-reusable-secs: "1800-3000"


proxy-groups:
  - name: 前置代理
    type: select
    interval: 300
    timeout: 3000
    url: https://www.google.com/generate_204
    lazy: true
    max-failed-times: 3
    hidden: false
    include-all: true
    filter: ^(?!.*(官网|套餐|流量|异常|剩余)).*$
    icon: https://fastly.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f9ed.svg

  # 自动择优（v4.6.0 新增）：按延迟自动选路，节点变慢或失效时自动切走。
  # 引入原因：此前所有组都是 select（纯手选），CDN 节点因运营商限速 UDP 443
  # 而单独变慢时不会被自动规避，只能人工发现——本项目 v4.6.0 的改动正是这么被发现的。
  # tolerance: 50   延迟差小于 50ms 不切换，避免抖动导致来回横跳。
  # lazy: true      仅在该组被实际使用时才测速，空闲时不额外打流量。
  # 注意：QUIC 节点（h3-direct / Hysteria2）冷启动可能超过 timeout 被判失败，
  # 这是测速的固有特性，tolerance + max-failed-times 已尽量减少误切。
  # 仍可在「节点选择」里手动指定具体节点，自动只是默认项。
  - name: 自动选择
    type: url-test
    interval: 300
    timeout: 3000
    url: https://www.google.com/generate_204
    lazy: true
    tolerance: 50
    max-failed-times: 3
    hidden: false
    include-all: true
    filter: ^(?!.*(官网|套餐|流量|异常|剩余)).*$
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/speed.svg

  - name: 节点选择
    type: select
    interval: 300
    timeout: 3000
    url: https://www.google.com/generate_204
    lazy: true
    max-failed-times: 3
    hidden: false
    proxies:
      - 自动选择
    include-all: true
    filter: ^(?!.*(官网|套餐|流量|异常|剩余)).*$
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/adjust.svg

  - name: 谷歌服务
